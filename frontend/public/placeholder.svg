<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" role="img" aria-label="Image coming soon">
  <!-- Portrait (3:4) to match product photography. Mirrors the 'neutral' texture in
       src/components/ui/ImagePlaceholder.jsx so <img> fallbacks match the other empty states. -->
  <defs>
    <linearGradient id="ph-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f2ed"/>
      <stop offset="1" stop-color="#e3d9c8"/>
    </linearGradient>
    <pattern id="ph-lines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="1" height="8" fill="#75654f" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="ph-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.9" stop-color="#75654f" stop-opacity="0"/>
      <stop offset="1" stop-color="#75654f" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="ph-shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#75654f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="300" height="400" fill="url(#ph-bg)"/>
  <rect width="300" height="400" fill="url(#ph-lines)"/>
  <rect width="300" height="400" fill="url(#ph-edge)"/>
  <rect x="0.5" y="0.5" width="299" height="399" fill="none" stroke="#75654f" stroke-opacity="0.12"/>

  <!-- Badge -->
  <rect x="72" y="186" width="156" height="28" rx="14" fill="#ffffff" fill-opacity="0.8" filter="url(#ph-shadow)"/>
  <text x="150" y="204" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#5e5140">IMAGE COMING SOON</text>
</svg>
