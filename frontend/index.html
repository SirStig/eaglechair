<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Loading spinner's eagle (a CSS mask, which the browser only requests once
         the spinner mounts, so it popped in after the ring). Mask images are
         fetched in CORS mode, hence crossorigin, or the preload isn't reused. -->
    <link rel="preload" as="image" href="/assets/eagle-mark.png" crossorigin="anonymous" fetchpriority="high" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eagle Chair" />
    
    <!-- Viewport - Optimized for mobile and all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <script>
      // Honour the browser's "Request Desktop Site". In that mode the phone
      // sends a desktop user agent but keeps its narrow device-width, so the
      // page would still get the mobile layout. Give it a desktop-width
      // viewport instead; switching back to the mobile site sends a mobile
      // user agent again, so this no longer applies. Tablets (shortest side
      // >= 768px) and touch laptops keep the normal responsive viewport.
      (function () {
        try {
          // Clear the old in-page "View Desktop Site" toggle, which could
          // leave visitors stuck in a half-desktop layout.
          localStorage.removeItem('eaglechair_desktop_view');
        } catch (e) {}
        var mobileUA = /Mobi|Android|iPhone|iPod|IEMobile|Opera Mini/i
          .test(navigator.userAgent || '');
        var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
        var shortSide = Math.min(screen.width, screen.height);
        if (!mobileUA && touch && shortSide < 768) {
          document.querySelector('meta[name="viewport"]')
            .setAttribute('content', 'width=1440, user-scalable=yes');
        }
      })();
    </script>

    <!-- Default page meta (home). vite.config.js (seoMetaPlugin) fills this
         block from src/config/seoConfig.js; the backend's prerendered page
         shells (backend/services/seo_prerender.py) replace it per page, and
         react-helmet-async takes the data-rh tags over on the client. -->
    <!--seo:start-->
    <!--seo:end-->

    <!-- Company and site identity on every page (same @ids as the page-level JSON-LD) -->
    <!-- One object with @graph, not a top-level array: some browser extensions
         read data["@context"] directly and throw on arrays -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
       {"@type":"Organization","@id":"__SITE_URL__/#organization","name":"Eagle Chair","legalName":"Eagle Chair, Inc.","url":"__SITE_URL__/","logo":"__MEDIA_BASE_URL__/assets/eagle-chair-logo.png","foundingDate":"1984","address":{"@type":"PostalAddress","addressLocality":"Houston","addressRegion":"TX","addressCountry":"US"}},
       {"@type":"WebSite","@id":"__SITE_URL__/#website","name":"Eagle Chair","url":"__SITE_URL__/","publisher":{"@id":"__SITE_URL__/#organization"}}]}
    </script>

    <!-- Theme Color -->
    <meta name="theme-color" content="#8b7355" />
    
    <!-- Uploaded media host (see resolveImageUrl in src/utils/apiHelpers.js) -->
    <link rel="preconnect" href="__MEDIA_BASE_URL__" />

    <!-- SSR: per-page meta tags are injected here by the SSR server -->
    <!--ssr-head-->

    <script>
      // Start loading CMS content before the JS bundle arrives. The app adopts
      // this promise (utils/contentDataLoader.js) instead of fetching again.
      // Also preloads the first hero slide (the LCP image) using the same
      // responsive variants HeroCarousel requests (media_service naming).
      (function () {
        // The SSR server embeds the content (window.__INITIAL_CONTENT__);
        // only fetch when it didn't.
        var p = window.__INITIAL_CONTENT__
          ? Promise.resolve(window.__INITIAL_CONTENT__)
          : fetch('/data/contentData.json', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        window.__contentDataPromise = p;
        p.then(function (d) {
          // Only the home page shows the hero; elsewhere this 200 KB+ download
          // would compete with the page's own images.
          if (location.pathname !== '/') return;
          var s = d && d.heroSlides && d.heroSlides[0];
          var u = s && (s.background_image_url || s.backgroundImageUrl || s.image);
          if (!u || u.indexOf('wp-content') !== -1) return;
          if (u.indexOf('http') !== 0) {
            u = u.charAt(0) === '/' ? u : '/uploads/' + u;
            var local = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
            if (u.indexOf('/uploads') === 0 && !local) u = 'https://joshua.eaglechair.com' + u;
          }
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.setAttribute('fetchpriority', 'high');
          var m = u.split('?')[0].match(/^(.*\/uploads\/images\/.*)\.(jpe?g|png|webp)$/i);
          if (m && !/\.(w\d+|full)$/.test(m[1])) {
            link.setAttribute('imagesrcset', [320, 640, 1024, 1600, 2400].map(function (w) {
              return m[1] + '.w' + w + '.webp ' + w + 'w';
            }).join(', '));
            link.setAttribute('imagesizes', '100vw');
          } else {
            link.href = u;
          }
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
