<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eagle Chair" />
    
    <!-- Viewport - Optimized for mobile and all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Eagle Chair - Premium Commercial Seating Solutions</title>
    <meta name="title" content="Eagle Chair - Premium Commercial Seating Solutions" />
    <meta name="description" content="Eagle Chair manufactures premium commercial seating for restaurants, hotels, healthcare facilities, and hospitality venues. Explore our durable, customizable furniture solutions." />
    <meta name="keywords" content="commercial seating, restaurant chairs, hotel furniture, healthcare seating, hospitality furniture, custom chairs, commercial furniture, Eagle Chair" />
    <meta name="author" content="Eagle Chair" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.eaglechair.com/" />
    <meta property="og:title" content="Eagle Chair - Premium Commercial Seating Solutions" />
    <meta property="og:description" content="Premium commercial seating for restaurants, hotels, healthcare facilities, and hospitality venues." />
    <meta property="og:image" content="https://www.eaglechair.com/og-image.jpg" />
    <meta property="og:site_name" content="Eagle Chair" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.eaglechair.com/" />
    <meta property="twitter:title" content="Eagle Chair - Premium Commercial Seating Solutions" />
    <meta property="twitter:description" content="Premium commercial seating for restaurants, hotels, healthcare facilities, and hospitality venues." />
    <meta property="twitter:image" content="https://www.eaglechair.com/twitter-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.eaglechair.com/" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8b7355" />
    
    <!-- Uploaded media host (see resolveImageUrl in src/utils/apiHelpers.js) -->
    <link rel="preconnect" href="https://joshua.eaglechair.com" />

    <!-- SSR: per-page meta tags are injected here by the SSR server -->
    <!--ssr-head-->

    <script>
      // Start loading CMS content before the JS bundle arrives. The app adopts
      // this promise (utils/contentDataLoader.js) instead of fetching again.
      // Also preloads the first hero slide (the LCP image) using the same
      // responsive variants HeroCarousel requests (media_service naming).
      (function () {
        // The SSR server embeds the content (window.__INITIAL_CONTENT__);
        // only fetch when it didn't.
        var p = window.__INITIAL_CONTENT__
          ? Promise.resolve(window.__INITIAL_CONTENT__)
          : fetch('/data/contentData.json', { cache: 'no-cache' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        window.__contentDataPromise = p;
        p.then(function (d) {
          // Only the home page shows the hero; elsewhere this 200 KB+ download
          // would compete with the page's own images.
          if (location.pathname !== '/') return;
          var s = d && d.heroSlides && d.heroSlides[0];
          var u = s && (s.background_image_url || s.backgroundImageUrl || s.image);
          if (!u || u.indexOf('wp-content') !== -1) return;
          if (u.indexOf('http') !== 0) {
            u = u.charAt(0) === '/' ? u : '/uploads/' + u;
            var local = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
            if (u.indexOf('/uploads') === 0 && !local) u = 'https://joshua.eaglechair.com' + u;
          }
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.setAttribute('fetchpriority', 'high');
          var m = u.split('?')[0].match(/^(.*\/uploads\/images\/.*)\.(jpe?g|png|webp)$/i);
          if (m && !/\.(w\d+|full)$/.test(m[1])) {
            link.setAttribute('imagesrcset', [320, 640, 1024, 1600, 2400].map(function (w) {
              return m[1] + '.w' + w + '.webp ' + w + 'w';
            }).join(', '));
            link.setAttribute('imagesizes', '100vw');
          } else {
            link.href = u;
          }
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
